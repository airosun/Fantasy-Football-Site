<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Too Many Cucks — League Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--turf:#14372b;--turf2:#1d4a3a;--chalk:#f2f4ef;--card:#fff;--ink:#17211c;--mute:#5d6b63;--line:#d9dfd6;--gold:#e3b23c;--win:#1f7a4d;--loss:#b4382f;--head:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--chalk:#101a15;--card:#18261f;--ink:#e8eee9;--mute:#9bab9f;--line:#2a3b32;--win:#4fbf86;--loss:#e8776d}}
*{box-sizing:border-box}
body{margin:0;background:var(--chalk);color:var(--ink);font:16px/1.45 var(--body)}
header{background:var(--turf);color:#fff;padding:18px 20px 0}
.top{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
h1{font:700 34px/1 var(--head);margin:0;letter-spacing:.02em}
nav{max-width:1100px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:#c8d6cd;font:600 18px var(--head);letter-spacing:.03em;padding:10px 16px;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:#fff;border-color:var(--gold)}
nav button:focus-visible,select:focus-visible,th button:focus-visible,.game:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:20px}
select{font:500 16px var(--body);padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px}
header select{background:var(--turf2);color:#fff;border-color:#33614f}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.bar h2{font:700 26px var(--head);margin:0}
.note{color:var(--mute);font-size:14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.game{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.game[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
.row+.row{border-top:1px solid var(--line)}
.row .n{font-weight:600}.row .m{font-size:13px;color:var(--mute);display:block;font-weight:400}
.row .s{font:700 28px var(--head)}.row.w .s{color:var(--win)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-top:16px;padding:18px}
.detail h3{font:700 24px var(--head);margin:0 0 12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 15px var(--head);letter-spacing:.03em}
th button{all:unset;cursor:pointer;font:inherit}
th[aria-sort] button::after{content:attr(data-arrow);margin-left:4px;color:var(--gold)}
.scroll{overflow-x:auto}
td.win{color:var(--win);font-weight:600}td.loss{color:var(--loss)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.box h3{font:700 22px var(--head);margin:0 0 8px}
.box ol,.box ul{margin:0;padding-left:20px}.box li{padding:3px 0}
.box ul.plain{list-style:none;padding:0}
.tx{border-top:1px solid var(--line);padding:8px 0}.tx small{color:var(--mute)}
.err{background:#f6dcd8;color:#6b1f18;padding:12px 14px;border-radius:6px}
@media(max-width:600px){h1{font-size:28px}}
.mt{table-layout:fixed;min-width:760px}
.mt th,.mt td{padding:7px 8px}
.mt td.pl{text-align:left;overflow:hidden;text-overflow:ellipsis}
.mt td.pl.r,.mt th.r{text-align:right}
.mt th.l{text-align:left}
.mt td.pt.a{text-align:right}.mt td.pt.h{text-align:left}
.mt td.mid{text-align:center;color:var(--mute);font:600 15px var(--head);letter-spacing:.03em}
.mt small{color:var(--mute);margin:0 6px;font-size:12px}
.mt tr.sec td{background:var(--chalk);font:700 17px var(--head);text-align:left;border-bottom:2px solid var(--line)}
.mt tr.fin td.mid{font:700 17px var(--head);color:var(--ink)}
.mt tr.fin td{font:700 24px var(--head);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.mt td.win{color:var(--win);font-weight:700}.mt td.loss{color:var(--loss);font-weight:400}
.hs{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line);vertical-align:middle;margin-right:8px;flex:none}
.hs.none{visibility:hidden}
ul.pl{list-style:none;padding:0;margin:0}ul.pl li{display:flex;align-items:center;padding:5px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.chip{font:600 15px var(--head);letter-spacing:.03em;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--turf);color:#fff;border-color:var(--turf)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
details.box summary{font:700 22px var(--head);cursor:pointer}
.lnk{all:unset;cursor:pointer;color:var(--ink);font-weight:600;border-bottom:1px dotted var(--mute)}
.lnk.sm{font-weight:400;font-size:13px;color:var(--mute);display:block;width:fit-content;margin-top:2px}
.lnk:hover,.lnk:focus-visible{color:var(--win);border-color:var(--win)}
.stick{min-width:1300px}
.stick th:first-child,.stick td:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
.tl{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin:0 6px}
.stick th:not(:first-child),.stick td:not(:first-child){text-align:center}
th button[title]{cursor:help}
th button .arr{color:var(--gold);margin-left:4px}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Too Many Cucks</h1><label class="note" style="color:#c8d6cd">Season <select id="season"></select></label></div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="view" aria-live="polite"></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=n=>(+n).toFixed(1);
const TABS=[['now','This Week'],['prev','Previous Matchups'],['mgr','Managers'],['season','Over the Season']];
let season,info,tab='now',mgrId=null;
const api=async p=>{const r=await fetch(`/api/${p}`);const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j};
const fail=e=>$('#view').innerHTML=`<div class="err">${esc(e.message)}</div>`;
const NFL={1:'atl',2:'buf',3:'chi',4:'cin',5:'cle',6:'dal',7:'den',8:'det',9:'gb',10:'ten',11:'ind',12:'kc',13:'lv',14:'lar',15:'mia',16:'min',17:'ne',18:'no',19:'nyg',20:'nyj',21:'phi',22:'ari',23:'pit',24:'lac',25:'sf',26:'sea',27:'tb',28:'wsh',29:'car',30:'jax',33:'bal',34:'hou'};
const abbr=t=>(NFL[t]||'FA').toUpperCase();
const logo=t=>NFL[t]?`<img class="tl" src="https://a.espncdn.com/i/teamlogos/nfl/500/${NFL[t]}.png" alt="${abbr(t)}" title="${abbr(t)}" loading="lazy" onerror="this.style.display='none'">`:'';
const img=id=>`<img class="hs" src="https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png" alt="" loading="lazy" onerror="this.classList.add('none')">`;

async function boot(){
  const s=await api('seasons').catch(fail); if(!s)return;
  $('#season').innerHTML=s.seasons.map(x=>`<option>${x}</option>`).join('');
  $('#season').value=season=s.default;
  $('#season').onchange=e=>{season=e.target.value;mgrId=null;load()};
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-k="${k}">${l}</button>`).join('');
  $('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;render()}};
  load();
}
async function load(){try{info=await api(`${season}/info`);render()}catch(e){fail(e)}}
function render(){
  $('#view').onclick=null;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===tab));
  ({now:viewNow,prev:viewPrev,mgr:viewMgr,season:viewSeason})[tab]().catch(fail);
}

/* ---------- Matchups ---------- */
const SLOT_ORDER=[0,2,4,6,3,5,23,7,16,17];
const SLOT_LABEL={0:'QB',2:'RB',3:'RB/WR',4:'WR',5:'WR/TE',6:'TE',7:'OP',16:'D/ST',17:'K',23:'FLEX'};
const POS={1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'D/ST'};
const rank=p=>{const i=SLOT_ORDER.indexOf(p.slot);return i<0?99:i};
const rowHtml=(t,win)=>`<div class="row ${win?'w':''}"><span class="n">${esc(t.name)}<span class="m">${esc(t.manager)} · ${t.total.str} Total Record</span></span><span class="s">${f1(t.score)}</span></div>`;
function matchups(el,wk){
  el.innerHTML=`<div class="games">${wk.games.map((g,i)=>`<button class="game" data-i="${i}" aria-pressed="false">${rowHtml(g.away,g.away.score>g.home.score)}${rowHtml(g.home,g.home.score>g.away.score)}</button>`).join('')}</div><div id="detail"></div>`;
  el.querySelector('.games').onclick=e=>{const b=e.target.closest('.game');if(!b)return;
    el.querySelectorAll('.game').forEach(x=>x.setAttribute('aria-pressed',x===b));
    el.querySelector('#detail').innerHTML=detail(wk.games[+b.dataset.i],wk.slots);el.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'nearest'})};
}
function detail(g,slots){
  const a=g.away,h=g.home;
  const win=(side,w)=>w===side?'win':(w==='tie'?'':'loss');
  const pName=(p,right)=>p?(right?`<small>${POS[p.pos]||''}</small>${esc(p.name)}${logo(p.team)}`:`${logo(p.team)}${esc(p.name)}<small>${POS[p.pos]||''}</small>`):'';
  const lineRows=(A,H,labelFn)=>{
    const n=Math.max(A.length,H.length);let out='';
    for(let i=0;i<n;i++){const x=A[i],y=H[i];
      out+=`<tr><td class="pl">${pName(x,false)}</td><td class="pt a">${x?f1(x.pts):''}</td><td class="mid">${labelFn(x||y)}</td><td class="pt h">${y?f1(y.pts):''}</td><td class="pl r">${pName(y,true)}</td></tr>`}
    return out};
  const stat=(label,av,hv,w)=>`<tr><td></td><td class="pt a ${win('away',w)}">${f1(av)}</td><td class="mid">${label}</td><td class="pt h ${win('home',w)}">${f1(hv)}</td><td></td></tr>`;
  const plain=(label,av,hv)=>`<tr><td></td><td class="pt a">${av}</td><td class="mid">${label}</td><td class="pt h">${hv}</td><td></td></tr>`;
  // one row per lineup slot, so an empty slot stays empty instead of shifting players up
  const slotRows=(A,H,slots)=>{
    const take=t=>{const m={};t.starters.forEach(p=>(m[p.slot]??=[]).push(p));return m};
    const ma=take(A),mh=take(H),used={};let out='';
    const known=new Set(slots);
    const order=slots.length?slots.slice():[];
    // any starter in a slot the league config didn't list still gets shown
    [...A.starters,...H.starters].forEach(p=>{if(!known.has(p.slot)){known.add(p.slot);order.push(p.slot)}});
    order.forEach(sl=>{const i=used[sl]=(used[sl]??-1)+1;const x=(ma[sl]||[])[i],y=(mh[sl]||[])[i];
      const cell=(p,right)=>p?pName(p,right):'<span class="note">Empty</span>';
      out+=`<tr><td class="pl">${cell(x,false)}</td><td class="pt a">${x?f1(x.pts):''}</td><td class="mid">${SLOT_LABEL[sl]||''}</td><td class="pt h">${y?f1(y.pts):''}</td><td class="pl r">${cell(y,true)}</td></tr>`});
    return out};
  const fw=a.score>h.score?'away':a.score<h.score?'home':'tie';
  return `<div class="detail"><div class="scroll"><table class="mt">
  <colgroup><col><col style="width:84px"><col style="width:190px"><col style="width:84px"><col></colgroup>
  <tr><th class="l" colspan="2">${esc(a.name)}<div class="note">${esc(a.manager)}</div></th><th></th><th class="r" colspan="2">${esc(h.name)}<div class="note">${esc(h.manager)}</div></th></tr>
  ${slotRows(a,h,slots)}
  <tr class="fin"><td></td><td class="pt a ${win('away',fw)}">${f1(a.score)}</td><td class="mid">Final Score</td><td class="pt h ${win('home',fw)}">${f1(h.score)}</td><td></td></tr>
  ${lineRows(a.bench,h.bench,p=>p.slot===21?'IR':'Bench')}
  <tr class="sec"><td colspan="5">Positional Breakdown</td></tr>
  ${['QB','RB','WR','TE','D/ST','K'].map(k=>stat(k,a.groups[k],h.groups[k],g.groupWinners[k])).join('')}
  <tr class="sec"><td colspan="5">Potential Points</td></tr>
  ${stat('Potential Points',a.potential,h.potential,g.potentialWinner)}
  ${plain('% of Potential Points',f1(a.pct)+'%',f1(h.pct)+'%')}
  ${plain('Total Record',a.total.str,h.total.str)}
  </table></div></div>`;
}
async function viewNow(){
  const wk=await api(`${season}/week/${info.current}`);
  $('#view').innerHTML=`<div class="bar"><h2>Week ${wk.week} Matchups</h2><span class="note">${wk.live?'Scores update during games. ':''}Last refreshed ${new Date(info.updated).toLocaleString()}</span></div><div id="m"></div>`;
  matchups($('#m'),wk);
}
async function viewPrev(){
  if(info.completed<1){$('#view').innerHTML='<p>No completed weeks yet. Check back after this week’s games.</p>';return}
  const opts=Array.from({length:info.completed},(_,i)=>info.completed-i);
  $('#view').innerHTML=`<div class="bar"><h2>Previous Matchups</h2><select id="wk" aria-label="Week">${opts.map(w=>`<option value="${w}">Week ${w}</option>`).join('')}</select></div><div id="m"></div>`;
  const go=async()=>matchups($('#m'),await api(`${season}/week/${$('#wk').value}`));
  $('#wk').onchange=()=>go().catch(fail);await go();
}

/* ---------- Managers ---------- */
const list=(a,fmt)=>a.length?`<ul class="pl">${a.map(fmt).join('')}</ul>`:'<p class="note">Nothing yet.</p>';
const lead=p=>`<li>${img(p.id)}<span><strong>${esc(p.name)}</strong>${logo(p.team)}<br>${f1(p.pts)} <span class="note">(${f1(p.avg)} avg)</span></span></li>`;
const perf=p=>`<li>${img(p.id)}<span><strong>${esc(p.name)}</strong>${logo(p.team)}<br>${f1(p.pts)} <span class="note">Week ${p.week}</span></span></li>`;
const FLEX=['RB','WR','TE'], POSCHIPS=['QB','RB','WR','TE','FLEX','D/ST','K'], ROLECHIPS=['Starter','Bench'];
const SO=[0,2,4,6,3,5,23,7,16,17,20,21];
async function viewMgr(){
  if(mgrId==null||!info.teams.some(t=>t.id===mgrId))mgrId=info.teams[0].id;
  $('#view').innerHTML=`<div class="bar"><h2>Managers</h2><select id="mg" aria-label="Manager">${info.teams.map(t=>`<option value="${t.id}">${esc(t.manager||'Unknown')} — ${esc(t.name)}</option>`).join('')}</select></div><div id="m"></div>`;
  $('#mg').value=mgrId;
  const go=async()=>{mgrId=+$('#mg').value;const m=await api(`${season}/manager/${mgrId}`);
    $('#m').innerHTML=`<h3 style="font:700 28px var(--head);margin:0 0 12px">${esc(m.name)} <span class="note">${esc(m.manager)}</span></h3>
    <div class="two"><div class="box"><h3>Current Roster</h3><div id="rost"></div></div>
    <div><div class="box" style="margin-bottom:16px"><h3>Scoring Leaders: Points Started</h3>${list(m.leadersStarted,lead)}<h3 style="margin-top:14px">Scoring Leaders: Total Points</h3>${list(m.leadersTotal,lead)}</div>
    <div class="box"><h3>Top Started Performances</h3>${list(m.bestStarted,perf)}<h3 style="margin-top:14px">Top Bench Performances</h3>${list(m.bestBench,perf)}</div></div></div>
    <details class="box" style="margin-top:16px"><summary>Transactions (${m.transactions.length})</summary><div class="bar" style="margin-top:12px"><label class="note">Type <select id="txf"><option value="">All Types</option>${m.transactionTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label></div><div id="txl"></div></details>`;
    roster(m.roster);
    const drawTx=()=>{const v=$('#txf').value,rows=m.transactions.filter(t=>!v||t.type===v);
      $('#txl').innerHTML=rows.length?rows.map(t=>`<div class="tx"><small>${new Date(t.date).toLocaleDateString()} · ${esc(t.type)}</small><br>${t.lines.map(esc).join('<br>')}</div>`).join(''):'<p class="note">No transactions to show.</p>'};
    $('#txf').onchange=drawTx;drawTx()};
  $('#mg').onchange=()=>go().catch(fail);await go();
}
function roster(rows){
  const pos=new Set(),role=new Set();let sk='slot',sd=1;
  const draw=()=>{
    const show=rows.filter(p=>{
      const pOk=!pos.size||[...pos].some(c=>c==='FLEX'?FLEX.includes(p.pos):c===p.pos);
      return pOk&&(!role.size||role.has(p.role))});
    const val=p=>sk==='slot'?(SO.indexOf(p.slot)<0?99:SO.indexOf(p.slot)):sk==='name'?p.name:sk==='team'?abbr(p.team):sk==='pos'?p.pos:p.role+(p.ir?' IR':'');
    show.sort((x,y)=>{const a=val(x),b=val(y);return sd*(typeof a==='number'?a-b:a.localeCompare(b))});
    const chip=(g,v)=>`<button class="chip" data-g="${g}" data-v="${v}" aria-pressed="${(g==='p'?pos:role).has(v)}">${v}</button>`;
    const th=(k,l)=>`<th ${sk===k?`aria-sort="${sd<0?'descending':'ascending'}"`:''}><button data-s="${k}">${l}${sk===k?`<span class="arr">${sd<0?'▼':'▲'}</span>`:''}</button></th>`;
    $('#rost').innerHTML=`<div class="note">Position</div><div class="chips">${POSCHIPS.map(v=>chip('p',v)).join('')}</div><div class="note">Role</div><div class="chips">${ROLECHIPS.map(v=>chip('r',v)).join('')}</div>
    <table><thead><tr>${th('name','Player')}${th('team','Team')}${th('pos','Position')}${th('role','Role')}</tr></thead><tbody>${show.map(p=>`<tr><td>${esc(p.name)}</td><td>${logo(p.team)}${abbr(p.team)}</td><td>${p.pos}</td><td>${p.role}${p.ir?' (IR)':''}</td></tr>`).join('')||'<tr><td colspan="4" class="note">No players match these filters.</td></tr>'}</tbody></table>`;
  };
  $('#rost').onclick=e=>{const c=e.target.closest('.chip'),b=e.target.closest('[data-s]');
    if(c){const set=c.dataset.g==='p'?pos:role;set.has(c.dataset.v)?set.delete(c.dataset.v):set.add(c.dataset.v);draw()}
    else if(b){const k=b.dataset.s;sd=k===sk?-sd:1;sk=k;draw()}};
  draw();
}

/* ---------- Over the Season ---------- */
const COLS=[['name','Team','Team','The team and its manager.'],
['winPct','Record','Record','Win-loss record against scheduled opponents.'],
['totalPct','Total Record','Total Record','Record if the team played every other team every week.'],
['pf','PF','Points For','Total points scored.'],
['pa','PA','Points Against','Total points opponents have scored.'],
['diff','Diff','Point Differential','The difference between Points For and Points Against.'],
['pfpg','PFPG','Points For Per Game','Average points scored each week.'],
['papg','PAPG','Points Against Per Game','Average opponent score each week.'],
['ppf','PotPF','Potential Points For','How many total points could have been scored with an optimal lineup.'],
['ppa','PotPA','Potential Points Against','How many total points opponents could have scored with optimal lineups.'],
['pctPf','%PF','% of Points For Scored','What percentage of Potential Points were actually scored.'],
['pctPa','%PA','% of Points Against Scored','What percentage of Potential Points opponents actually scored.']];
let sortKey='winPct',sortDir=-1;
async function viewSeason(){
  const rows=await api(`${season}/standings`);
  const draw=()=>{
    const x=$('#view .scroll')?.scrollLeft||0;
    rows.sort((a,b)=>sortKey==='name'?sortDir*a.name.localeCompare(b.name):sortDir*(a[sortKey]-b[sortKey]));
    $('#view').innerHTML=`<div class="bar"><h2>Over the Season</h2><span class="note">Through week ${info.completed}. Select a column to sort, or a team or manager to open their page.</span></div><div class="scroll"><table class="stick"><thead><tr>${COLS.map(([k,l,full,def])=>`<th ${k===sortKey?`aria-sort="${sortDir<0?'descending':'ascending'}"`:''}><button data-k="${k}" title="${full}: ${def}" aria-label="${full}">${l}${k===sortKey?`<span class="arr">${sortDir<0?'▼':'▲'}</span>`:''}</button></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><button class="lnk" data-go="${r.id}">${esc(r.name)}</button><button class="lnk sm" data-go="${r.id}">${esc(r.manager)}</button></td><td>${r.record}</td><td>${r.totalRecord}</td><td>${f1(r.pf)}</td><td>${f1(r.pa)}</td><td>${f1(r.diff)}</td><td>${f1(r.pfpg)}</td><td>${f1(r.papg)}</td><td>${f1(r.ppf)}</td><td>${f1(r.ppa)}</td><td>${f1(r.pctPf)}%</td><td>${f1(r.pctPa)}%</td></tr>`).join('')}</tbody></table></div>`;
    $('#view .scroll').scrollLeft=x;
  };
  $('#view').onclick=e=>{
    const g=e.target.closest('[data-go]');if(g){mgrId=+g.dataset.go;tab='mgr';render();return}
    const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;sortDir=k===sortKey?-sortDir:(k==='name'?1:-1);sortKey=k;draw()};
  draw();
}
boot();
</script>
</body>
</html>
